n(&#x27;entity&#x27;,&#x27;抽取指标 / 维度 / 时间&#x27;,&#x27;先圈出业务关键词：销售额是“算什么”，品牌是“按什么分组”，最近7天是“查哪段时间”。&#x27;,&#x27;问题与语义注册表&#x27;,&#x27;Entities&#x27;,&#x27;帮助路由器判断问题结构。&#x27;,&#x27;实体识别是规划提示，不是最终DSL。把某词识别为维度，不意味着用户一定要求按它分组；“华东”通常是过滤条件。&#x27;,&#x27;nl2dsl/agent/orchestrator.py&#x27;,&#x27;_extract_entities&#x27;);
n(&#x27;route&#x27;,&#x27;判断意图与执行路径&#x27;,&#x27;先确定你在做单次查询、对比还是趋势，再决定使用哪条路径。&#x27;,&#x27;Entities与question&#x27;,&#x27;SimpleExecutionPlan / ComplexExecutionPlan / ExplorationPlan&#x27;,&#x27;先判断任务类型才能选正确汇总方式。&#x27;,&#x27;AgentController优先调用Planner；非single_query进入复杂路径。single_query且有指标与维度进入简单路径，其余进入探索。Planner不可用时按实体数量/时间降级判断，可能产生粗糙分类。&#x27;,&#x27;nl2dsl/agent/controller.py&#x27;,&#x27;route&#x27;);
n(&#x27;plan&#x27;,&#x27;规划子查询&#x27;,&#x27;把“华东与华南销售额对比”写成两个任务，并说明后续如何比较。&#x27;,&#x27;问题、intents配置、可选LLM&#x27;,&#x27;Plan(intent, sub_queries, reasoning)&#x27;,&#x27;清楚区分“需要哪些数据”和“如何执行每个查询”。&#x27;,&#x27;Planner负责意图与拆解，Graph内部也有plan节点。已经拆好的复杂子查询会预置single_query计划，防止再次被识别成复杂任务。&#x27;,&#x27;nl2dsl/agent/planner.py&#x27;,&#x27;Planner.plan&#x27;,&#x27;示意计划：sq-1 查华东销售额；sq-2 查华南销售额；intent=compare。&#x27;);
n(&#x27;dispatch&#x27;,&#x27;调度子查询&#x27;,&#x27;互不依赖的任务可以同时查；依赖前一个结果的任务要等它完成。&#x27;,&#x27;SubQuery列表、DomainContext、用户身份&#x27;,&#x27;按子查询ID组织的QueryResult&#x27;,&#x27;缩短等待时间，同时避免依赖尚未满足就执行。&#x27;,&#x27;当前无依赖任务最多3个并发；依赖任务按依赖关系调度。每个子查询仍调用领域Graph。调度并发是项目运行机制，与绘图过程无关。&#x27;,&#x27;nl2dsl/agent/dispatcher.py&#x27;,&#x27;dispatch_sub_queries&#x27;);
n(&#x27;explore&#x27;,&#x27;探索路径：当前占位&#x27;,&#x27;面对没有明确指标或维度的开放式问题，系统先包装成探索计划。&#x27;,&#x27;ExplorationPlan&#x27;,&#x27;单查询Graph结果&#x27;,&#x27;为未来探索型分析保留接口。&#x27;,&#x27;目前_run_exploration_path直接委托_run_simple_path。不能把它理解为已经具备自动多轮发现原因、钻取与探索的完整能力。&#x27;,&#x27;nl2dsl/agent/orchestrator.py&#x27;,&#x27;_run_exploration_path&#x27;);
n(&#x27;aggregate&#x27;,&#x27;汇总多任务结果&#x27;,&#x27;把多个子查询的行合在一起，再根据意图计算对比、趋势、占比或排名等结果。&#x27;,&#x27;多个QueryResult与intent&#x27;,&#x27;汇总rows及分析内容&#x27;,&#x27;两个查询各有一个数字时，还需要知道该如何比较这两个数字。&#x27;,&#x27;全部子任务失败/澄清会返回错误；部分被阻断通常返回warning。聚合器有compare、trend、correlation、proportion、ranking处理。聚合算法只是数据处理，不自动证明因果关系。&#x27;,&#x27;nl2dsl/agent/aggregator.py&#x27;,&#x27;Aggregate.run&#x27;);
n(&#x27;state&#x27;,&#x27;共享状态QueryState&#x27;,&#x27;每个工序拿着同一份工作档案，只更新自己负责的部分。&#x27;,&#x27;question、domain、user_id、tenant_id等&#x27;,&#x27;逐步添加dsl、sql、data、trace、error&#x27;,&#x27;节点之间传递信息，不需要依赖隐蔽的全局变量。&#x27;,&#x27;TypedDict定义字段；trace和dsl_attempts有累积合并机制。状态字段不是流程节点：例如sql保存的是成果，不会自动执行。&#x27;,&#x27;nl2dsl/graph/state.py&#x27;,&#x27;QueryState&#x27;);
n(&#x27;clarify&#x27;,&#x27;clarification：先检测歧义&#x27;,&#x27;问题不够清楚时先让你确认，例如不明确的指标或时间。&#x27;,&#x27;question&#x27;,&#x27;ambiguities或继续执行&#x27;,&#x27;避免在不确定的业务含义上直接计算。&#x27;,&#x27;Graph遇到已有DSL或没有LLM时跳过；普通/query还可能在API层做启用后的预检。检测到歧义就结束本次Graph，返回clarification；不等于页面已经有完善的追问对话。&#x27;,&#x27;nl2dsl/graph/nodes.py&#x27;,&#x27;clarification_node&#x27;);
n(&#x27;gplan&#x27;,&#x27;plan：单查询还是交给Agent&#x27;,&#x27;在Graph入口确认，这次任务是否能沿单查询流水线继续。&#x27;,&#x27;question或已有Plan&#x27;,&#x27;single_query继续；其他意图结束Graph&#x27;,&#x27;避免把复杂任务强塞进单查询执行器。&#x27;,&#x27;route_after_plan对非single_query返回agent并到END；真正复杂编排在图外完成。dispatcher为子查询预置single_query计划来跳过重复分类。&#x27;,&#x27;nl2dsl/graph/edges.py&#x27;,&#x27;route_after_plan&#x27;);
n(&#x27;decompose&#x27;,&#x27;decompose：改写复杂表述&#x27;,&#x27;把复杂表述尽量改写为能用一份DSL表达的问题。&#x27;,&#x27;原问题、复杂性标记、可选LLM&#x27;,&#x27;改写问题、original_question、rewrite_reason&#x27;,&#x27;帮助DSL生成器理解复杂句子。&#x27;,&#x27;这个节点叫decompose，但主要职责是“单DSL问题改写”；它与Agent层拆成多个SubQuery不是一回事。简单问题可直接跳过。&#x27;,&#x27;nl2dsl/graph/nodes.py&#x27;,&#x27;_make_decompose_node&#x27;);
n(&#x27;rag&#x27;,&#x27;RAG：查业务参考资料&#x27;,&#x27;像开卷考试：先查表结构、指标定义、术语和历史问题，再把相关片段给模型。&#x27;,&#x27;问题与领域检索器&#x27;,&#x27;上下文文本context&#x27;,&#x27;减少模型凭空猜字段和业务口径。&#x27;,&#x27;当前RAG检索发生在generate_dsl或correct_dsl函数内部，并非主图独立节点。可结合关键词与向量检索，选配重排；RAG不可用可降级，质量可能降低。&#x27;,&#x27;nl2dsl/rag/retriever.py&#x27;,&#x27;build_context&#x27;,null,&#x27;ragflow&#x27;);
n(&#x27;generate&#x27;,&#x27;generate_dsl：生成结构化查询单&#x27;,&#x27;把自然语言翻译成JSON查询要求：查哪个源、算哪些指标、如何分组、筛选与排序。&#x27;,&#x27;question、RAG上下文、注册语义&#x27;,&#x27;Pydantic DSL对象与生成尝试记录&#x27;,&#x27;让程序能校验业务请求，而不是执行一段模型随意写出的SQL。&#x27;,&#x27;有LLM时调用模型并解析/补全输出；没有LLM时用RuleBasedDSLGenerator。LLM生成失败在校验子图中直接结束，不代表任何异常都会偷偷退回Mock。已提交DSL会跳过生成。&#x27;,&#x27;nl2dsl/graph/nodes.py&#x27;,&#x27;_make_generate_dsl_node&#x27;,null,&#x27;dslflow&#x27;);
n(&#x27;validate&#x27;,&#x27;validate_dsl：检查查询单&#x27;,&#x27;核对字段、数据源、指标、操作符和约束是否合法。&#x27;,&#x27;DSL与语义白名单&#x27;,&#x27;通过或validation失败记录&#x27;,&#x27;结构正确才能进入权限与执行阶段。&#x27;,&#x27;生成入口还可做SemanticValidator检查。校验子图失败会尝试纠正；用户直接提交DSL且无生成记录时，不自动改写。主图从validation到permission仍是固定边，错误处理依赖后续节点检查状态。&#x27;,&#x27;nl2dsl/dsl/validator.py&#x27;,&#x27;DSLValidator.validate&#x27;);
n(&#x27;correct&#x27;,&#x27;correct_dsl：带着错误修正&#x27;,&#x27;告诉模型“哪里错了”，让它选检索词，查相关资料，再重新生成查询单。&#x27;,&#x27;错误、上次DSL、RAG/LLM&#x27;,&#x27;修正DSL → 再validate&#x27;,&#x27;将可纠正的拼写与语义问题变成可执行查询。&#x27;,&#x27;route_after_validate按生成次数或校验失败次数设上限3，避免无限循环；不是“额外3次修正”的承诺。无LLM时修正可能无操作，失败计数仍确保终止。&#x27;,&#x27;nl2dsl/graph/nodes.py&#x27;,&#x27;_make_correct_dsl_node&#x27;);
n(&#x27;row&#x27;,&#x27;行级权限：给查询加数据范围&#x27;,&#x27;你有权看华东，系统就把“只看华东”的限制加进查询单。&#x27;,&#x27;DSL、user_id、permissions配置&#x27;,&#x27;注入行级过滤后的DSL&#x27;,&#x27;用户没有主动写权限条件，系统也必须主动限制可见数据。&#x27;,&#x27;实际注入入口是row_security.inject(dsl, user_id)。tenant_id随状态传递，但不能仅凭有这个字段推断已经自动实现所有租户隔离；具体限制要看权限配置。&#x27;,&#x27;nl2dsl/permission/row_level.py&#x27;,&#x27;RowLevelSecurity.inject&#x27;);
n(&#x27;col&#x27;,&#x27;列级权限：检查敏感字段&#x27;,&#x27;检查所请求的维度里有没有被配置为敏感、不可访问的字段。&#x27;,&#x27;DSL.dimensions、敏感列配置&#x27;,&#x27;通过或PermissionError&#x27;,&#x27;防止直接展示敏感数据。&#x27;,&#x27;当前ColumnLevelSecurity.check只遍历dimensions并匹配_sensitive。它不是覆盖指标、过滤、所有物理字段的通用授权检查器。mask方法存在，但execute_sql_node没有调用它，不能据此声称结果已全面脱敏。&#x27;,&#x27;nl2dsl/permission/column_level.py&#x27;,&#x27;check / mask&#x27;);
n(&#x27;semantic&#x27;,&#x27;resolve_semantic：翻译业务含义&#x27;,&#x27;把“销售额”“华东”翻译成已注册的计算表达式与数据库值。&#x27;,&#x27;DSL与metrics/dimensions注册表&#x27;,&#x27;展开指标、值映射后的DSL&#x27;,&#x27;业务语言和数据库编码不同；注册表是口径依据。&#x27;,&#x27;指标alias是权威标识，模型猜出的field不能决定物理列。SQLBuilder还有注册表达式展开兜底。维度映射和Join推导也会在构建阶段参与。&#x27;,&#x27;nl2dsl/semantic/resolver.py&#x27;,&#x27;SemanticResolver.resolve&#x27;);
n(&#x27;optimize&#x27;,&#x27;optimize_dsl：规则优化与诊断&#x27;,&#x27;像编辑检查查询单：规范结构、寻找语义问题、能修的修、不能确定的发警告、严重违规拒绝。&#x27;,&#x27;DSL、SemanticConfig、原始问题、可选权限上下文&#x27;,&#x27;优化DSL和报告&#x27;,&#x27;比单纯检查格式更进一步，检查业务请求是否合理。&#x27;,&#x27;当前Graph顺序是权限→语义解析→优化→置信度，且只有传入optimizer_semantic_config时挂载。部分文档写在权限前并始终执行，不能照搬。致命拒绝结束Graph；优化器异常在此节点只记trace错误并继续。&#x27;,&#x27;nl2dsl/graph/nodes.py&#x27;,&#x27;_make_optimize_dsl_node&#x27;,null,&#x27;optflow&#x27;);
n(&#x27;confidence&#x27;,&#x27;confidence：评估可靠程度&#x27;,&#x27;从语法、语义与历史等维度打分，决定继续、警告或请求澄清。&#x27;,&#x27;DSL、问题、validator、可选LLM&#x27;,&#x27;confidence、explanation与status&#x27;,&#x27;“能执行”不等于“正确回答问题”，需要质量信号。&#x27;,&#x27;分数是启发式评分，不是正确率概率。最终路由读取status；低分会进入clarification，warning仍可执行。没有LLM时语义评分有降级逻辑。&#x27;,&#x27;nl2dsl/agent/confidence.py&#x27;,&#x27;_make_confidence_node&#x27;);
n(&#x27;build&#x27;,&#x27;build_sql：程序构建SQL&#x27;,&#x27;用SQLAlchemy表达式拼装SELECT、聚合、WHERE、GROUP BY、JOIN、ORDER BY和LIMIT。&#x27;,&#x27;经过处理的DSL、注册表、数据库表结构&#x27;,&#x27;SQL字符串&#x27;,&#x27;SQL是系统实现细节，来自可校验DSL。&#x27;,&#x27;SQLBuilder依据指标注册expr和维度映射构建，并能推导需要的Join。图上的简单/复杂分支都进入scan_sql，没有两套独立SQL执行路径。dialect.py存在，但当前Graph build_sql节点直接调用SQLBuilder，未显式串联DialectConverter。&#x27;,&#x27;nl2dsl/sql_engine/builder.py&#x27;,&#x27;SQLBuilder.build&#x27;);
n(&#x27;scan&#x27;,&#x27;scan_sql：扫描危险SQL&#x27;,&#x27;执行前查有没有删除、更新、建表、UNION、注释或多语句等禁用内容。&#x27;,&#x27;SQL文本&#x27;,&#x27;扫描通过或ValidationError&#x27;,&#x27;加一道执行前安全检查。&#x27;,&#x27;当前扫描器是正则检测，不能理解全部SQL语法，也不是完整安全证明。Graph scan_sql到sandbox是固定边；错误包装器只记录状态，不会统一跳过后续节点；扫描失败后的固定边与沙箱预览需要核对，不能声称所有错误都立即停止。&#x27;,&#x27;nl2dsl/sql_engine/scanner.py&#x27;,&#x27;SQLScanner.scan&#x27;);
n(&#x27;sandbox&#x27;,&#x27;sandbox_check：执行前预检&#x27;,&#x27;先看查询计划，做受限预览和耗时风险检测，评估查询是否可能太重。&#x27;,&#x27;SQL与数据库连接&#x27;,&#x27;SandboxResult(passed, risks等)&#x27;,&#x27;避免一个查询消耗过多数据库资源。&#x27;,&#x27;沙箱不通过→human_review；通过→execute_sql。预检包含受限查询，因此不能理解成“完全不碰数据库”。估算能力受数据库方言与实现影响。&#x27;,&#x27;nl2dsl/query/sandbox.py&#x27;,&#x27;QuerySandbox.check&#x27;);
n(&#x27;review&#x27;,&#x27;human_review：人工确认分支&#x27;,&#x27;对沙箱发现的风险，标记待审核并等待恢复流程。&#x27;,&#x27;风险列表与Graph检查点&#x27;,&#x27;pending_review或恢复执行&#x27;,&#x27;高风险查询应能由人确认后再执行。&#x27;,&#x27;节点本身只是pending_review占位。build_graph只有有checkpointer时设置interrupt_before=[human_review]；没有检查点时该节点之后仍可能进入execute。恢复接口存在，不能把占位节点理解为完整审批产品。&#x27;,&#x27;nl2dsl/graph/builder.py&#x27;,&#x27;compile_kwargs / _route_after_human_review&#x27;);
n(&#x27;execute&#x27;,&#x27;execute_sql：查询数据库&#x27;,&#x27;数据库真正读取数据，计算聚合并返回行。&#x27;,&#x27;SQL、executor、可选DSL.post_process&#x27;,&#x27;data列表与success/warning&#x27;,&#x27;前面所有步骤都是准备，这里才产生业务查询结果。&#x27;,&#x27;execute_sql_node调用executor.execute，属于同步调用。执行后如有post_process再加工结果；当前节点没有调用ColumnLevelSecurity.mask。执行异常由错误处理器写入状态，随后可能进入简化重试。&#x27;,&#x27;nl2dsl/graph/nodes.py&#x27;,&#x27;execute_sql_node&#x27;);
n(&#x27;post&#x27;,&#x27;结果后处理：分组TopN / 占比&#x27;,&#x27;先拿到基础汇总数据，再按DSL声明计算每组前N名或比例。&#x27;,&#x27;data与DSL.post_process&#x27;,&#x27;加工后的data&#x27;,&#x27;“每个品类第一名”与“全部产品第一名”不是同一种排名。&#x27;,&#x27;代码在execute_sql节点内调用apply_post_process，不是一个独立LangGraph节点。比例的分母依赖实际取得的数据与配置；查询被limit截断时应核对口径。&#x27;,&#x27;nl2dsl/query/post_processor.py&#x27;,&#x27;apply_post_process&#x27;);
n(&#x27;simplify&#x27;,&#x27;simplify_dsl：执行失败后简化重试&#x27;,&#x27;把查询变小再试：只保留首个指标和维度，清掉Join、过滤、排序和后处理，limit最多10。&#x27;,&#x27;执行失败时的DSL&#x27;,&#x27;简化DSL → build_sql → scan → sandbox → execute&#x27;,&#x27;试图给失败查询提供一次兜底。&#x27;,&#x27;这是当前代码的重要风险：filters被清空，可能连已注入的行级权限也被删掉；重试边直接回build_sql，未重新经过权限与校验。还有业务语义丢失。route_after_execute最多允许1次简化重试；本图揭示行为，没有修改代码。&#x27;,&#x27;nl2dsl/graph/nodes.py&#x27;,&#x27;simplify_dsl_node&#x27;);
n(&#x27;verify&#x27;,&#x27;verify_dsl：执行后模型自检&#x27;,&#x27;再问模型：这个DSL和结果有没有回答原始问题？给PASS、WARN或FAIL与理由。&#x27;,&#x27;原问题、DSL、结果、可选LLM&#x27;,&#x27;verify_status与verify_reason&#x27;,&#x27;查到数据仍可能漏条件、错分组，需要事后检查。&#x27;,&#x27;目前是warning-only，不因为模型自检FAIL自动撤回数据。无LLM可跳过。execute路由的end实际指向verify_dsl，也包括重试耗尽的错误路径，部分自检节点会按状态跳过，但并非所有节点都统一跳过错误状态。&#x27;,&#x27;nl2dsl/graph/nodes.py&#x27;,&#x27;_make_verify_dsl_node&#x27;);
n(&#x27;explain&#x27;,&#x27;explain：用人话说明结果&#x27;,&#x27;把指标、数据与查询过程组织成文字，帮助你读懂数字。&#x27;,&#x27;原问题、Plan/DSL、data&#x27;,&#x27;explanation&#x27;,&#x27;解释查询口径、结果规模与质量提示。&#x27;,&#x27;解释是呈现层，不会让错DSL自动变对。Agent路径还会生成模板说明，因此要区分Graph解释与最终Agent解释。&#x27;,&#x27;nl2dsl/agent/explainer.py&#x27;,&#x27;_make_explain_node&#x27;);
n(&#x27;startup&#x27;,&#x27;启动：准备每个领域的工具箱&#x27;,&#x27;服务启动时加载配置、数据库和各个组件，组装可运行的Graph。&#x27;,&#x27;configs目录、Settings、可选插件&#x27;,&#x27;Engine与多个DomainContext&#x27;,&#x27;查询到来之前就准备好规则与连接。&#x27;,&#x27;metrics.yaml对应ecommerce，xxx_metrics.yaml对应xxx领域。Engine共享LLM/可选嵌入模型等，领域有各自注册表、数据库、权限和Graph；默认数据库由领域命名。&#x27;,&#x27;nl2dsl/engine.py&#x27;,&#x27;_load_defaults&#x27;,null,&#x27;support&#x27;);
n(&#x27;registry&#x27;,&#x27;语义注册表：统一业务字典&#x27;,&#x27;告诉系统“销售额是什么”“品牌对应哪一列”“哪些源支持哪些指标”。&#x27;,&#x27;metrics、dimensions、data_sources YAML&#x27;,&#x27;内存SemanticRegistry&#x27;,&#x27;防止模型发明不存在的指标与维度。&#x27;,&#x27;物理字段、聚合表达式、维度值映射和源覆盖由配置提供。改业务口径先看配置，不应随手在API写死。不同领域可加载不同配置。&#x27;,&#x27;nl2dsl/semantic/registry.py&#x27;,&#x27;SemanticRegistry.load&#x27;);
n(&#x27;permissions&#x27;,&#x27;权限配置：统一访问规则&#x27;,&#x27;配置用户能看什么范围、哪些维度敏感及脱敏规则。&#x27;,&#x27;permissions.yaml及各领域权限文件&#x27;,&#x27;RowLevelSecurity与ColumnLevelSecurity&#x27;,&#x27;治理应来自权威配置而非模型建议。&#x27;,&#x27;Engine加载域权限，缺失的非电商权限文件可能回退公共permissions.yaml。配置存在与运行时全面实施是两件事：需要逐个核对注入、检查、脱敏的调用。&#x27;,&#x27;nl2dsl/engine.py&#x27;,&#x27;_load_defaults：permissions&#x27;);
n(&#x27;sync&#x27;,&#x27;启动同步业务知识&#x27;,&#x27;把配置中的表结构、指标、术语、历史等知识更新到检索库。&#x27;,&#x27;配置与领域向量存储&#x27;,&#x27;可供RAG召回的知识集合&#x27;,&#x27;防止检索器读到过期的业务信息。&#x27;,&#x27;RAG属于可选依赖；本地模型路径、嵌入模型或Milvus初始化失败会影响可用性。同步是启动准备，不是每次问题都重新建库。&#x27;,&#x27;nl2dsl/rag/sync.py&#x27;,&#x27;auto_sync&#x27;);
n(&#x27;vector&#x27;,&#x27;关键词 + 向量检索&#x27;,&#x27;关键词用于精确命中业务词；向量用于找到意思相近的文本。&#x27;,&#x27;问题、schema/metrics/terms/history集合&#x27;,&#x27;候选文档列表&#x27;,&#x27;既处理明确字段名，也处理不同说法的同一业务问题。&#x27;,&#x27;混合召回与上下文构造在RAGRetriever中实现；vector只是参考检索，不直接读取业务数据库答案。&#x27;,&#x27;nl2dsl/rag/retriever.py&#x27;,&#x27;retrieve_hybrid&#x27;);
n(&#x27;rerank&#x27;,&#x27;可选重排与上下文拼装&#x27;,&#x27;把更相关的资料排前面，并限制上下文长度后交给模型。&#x27;,&#x27;检索候选片段&#x27;,&#x27;更精简的context / prompt&#x27;,&#x27;模型上下文有限，相关资料比大量无关资料更有用。&#x27;,&#x27;重排器由设置启用，加载失败会继续使用无重排模式。RAG不能保证指标选择正确，后面仍要校验。&#x27;,&#x27;nl2dsl/rag/retriever.py&#x27;,&#x27;build_context&#x27;);
n(&#x27;dsl&#x27;,&#x27;DSL：结构化查询单&#x27;,&#x27;它是人话与SQL之间的合同。每个字段都有类型与含义，程序能逐项检查。&#x27;,&#x27;问题的结构化表达&#x27;,&#x27;DSL对象&#x27;,&#x27;给校验、权限、优化和解释提供同一份可读契约。&#x27;,&#x27;核心有data_source、metrics、dimensions、filters、time_range、joins、having、order_by、limit、offset和post_process。实际可接受形式以models.py为准。&#x27;,&#x27;nl2dsl/dsl/models.py&#x27;,&#x27;DSL&#x27;,null,&#x27;dslflow&#x27;);
n(&#x27;metric&#x27;,&#x27;metrics：算什么&#x27;,&#x27;销售额、订单数、客单价属于指标；聚合函数决定如何把多行数据变成数字。&#x27;,&#x27;注册指标alias、func与field&#x27;,&#x27;聚合表达式与输出列&#x27;,&#x27;统一“求和”“计数”“平均”等计算含义。&#x27;,&#x27;alias必须指向注册指标；field的模型猜测要由注册expr纠正。计算复杂派生指标时不能机械地把所有表达式都解释为简单SUM。&#x27;,&#x27;nl2dsl/dsl/models.py&#x27;,&#x27;Metric&#x27;,&#x27;示意：{func:&quot;sum&quot;, field:&quot;pay_amount&quot;, alias:&quot;sales_amount&quot;}，口径仍以该领域注册expr为准。&#x27;);
n(&#x27;dimension&#x27;,&#x27;dimensions：按什么分组&#x27;,&#x27;“各品牌”意味着一品牌一行；不填维度通常是整体汇总。&#x27;,&#x27;注册维度名称列表&#x27;,&#x27;GROUP BY键与显示列&#x27;,&#x27;区分“全国一个总数”和“各地区一个数”。&#x27;,&#x27;“华东销售额”中的华东是过滤值，不自动意味着按地区分组。维度需要语义映射，可能引入维度表Join。&#x27;,&#x27;nl2dsl/dsl/models.py&#x27;,&#x27;DSL.dimensions&#x27;,&#x27;示意：dimensions:[&quot;brand&quot;]&#x27;);
n(&#x27;filter&#x27;,&#x27;filters / time_range：哪些数据参与&#x27;,&#x27;筛选地区、渠道、金额和日期范围，只让符合条件的原始记录参与计算。&#x27;,&#x27;字段、操作符、值，或条件树&#x27;,&#x27;WHERE与时间条件&#x27;,&#x27;不限定范围，数字可能看起来正常却不是你要的。&#x27;,&#x27;支持列表或and/or/not树等模型形式；having是聚合后过滤，不能与原始行过滤混淆。时间需要绝对边界、参考日期和粒度，不能只认出“上月”就算解析完整。&#x27;,&#x27;nl2dsl/dsl/models.py&#x27;,&#x27;Filter / FilterGroup / TimeRange&#x27;,&#x27;示意：region = 华东；pay_amount &gt; 5000。此处为讲解示例，不代表真实运行结果。&#x27;);
n(&#x27;join&#x27;,&#x27;joins：关联其他表&#x27;,&#x27;订单里只有产品编号，想按品牌看销售，就要关联产品表找到品牌。&#x27;,&#x27;关联表、连接类型与连接字段&#x27;,&#x27;订单与维度表联合查询&#x27;,&#x27;将分散在多张表里的信息组合起来。&#x27;,&#x27;SQLBuilder可根据被引用的列和语义关系推导依赖Join。Join方向、基数与重复行会影响汇总，不能任意连接两个名称相似的字段。&#x27;,&#x27;nl2dsl/sql_engine/builder.py&#x27;,&#x27;_determine_required_joins&#x27;);
n(&#x27;order&#x27;,&#x27;order_by / limit：怎样排序、取多少&#x27;,&#x27;“销售额前5”就是先按销售额降序，再取5行。&#x27;,&#x27;排序字段、方向、limit/offset&#x27;,&#x27;排序与分页SQL&#x27;,&#x27;保证“前几名”是业务排序而非数据库碰巧先返回的行。&#x27;,&#x27;全局Top5与每组Top5不同，后者可能走post_process。limit限制返回行数，不保证底层扫描行数同样少。&#x27;,&#x27;nl2dsl/dsl/models.py&#x27;,&#x27;OrderBy / DSL.limit&#x27;);
n(&#x27;normalize&#x27;,&#x27;Normalizer：结构规范化&#x27;,&#x27;把不同写法整理成统一格式，比如补默认值、清理重复项目。&#x27;,&#x27;原始DSL dict&#x27;,&#x27;标准结构DSL&#x27;,&#x27;让后面的规则不用反复处理格式差异。&#x27;,&#x27;结构规范化与业务语义验证分工不同；它不能凭空确定一个业务指标的正确口径。&#x27;,&#x27;nl2dsl/optimizer/normalizer.py&#x27;,&#x27;Normalizer&#x27;);
n(&#x27;rules&#x27;,&#x27;RuleEngine：按优先级查问题&#x27;,&#x27;依次执行注册规则：指标、维度、过滤、意图、规划、时间、歧义、治理和结构。&#x27;,&#x27;规范化DSL与RuleContext&#x27;,&#x27;修正后的DSL与OptimizationReport&#x27;,&#x27;使修正过程可追踪，而不是无声地改条件。&#x27;,&#x27;Fix且可自动修正才应用fix；Warn记录提示；只有is_fatal且Reject才立刻中止。普通Reject会继续收集问题；单条规则异常转换成warning。&#x27;,&#x27;nl2dsl/optimizer/engine.py&#x27;,&#x27;RuleEngine.run&#x27;);
n(&#x27;canonical&#x27;,&#x27;CanonicalResolver：统一最终表达&#x27;,&#x27;把业务含义相同但写法不同的DSL转换到统一表达，评测也能对齐比较。&#x27;,&#x27;优化后的DSL与语义配置&#x27;,&#x27;canonical DSL / 解析结果&#x27;,&#x27;避免等价查询因为表面写法不同被误判。&#x27;,&#x27;当前optimize()只执行Normalizer和RuleEngine；CanonicalResolver在评测目录里存在，但尚未串入该优化调用。三层是设计目标，当前运行只有前两层。&#x27;,&#x27;nl2dsl/evaluation/canonical/resolver.py&#x27;,&#x27;CanonicalResolver&#x27;);
n(&#x27;feedback&#x27;,&#x27;用户反馈：保存纠错证据&#x27;,&#x27;结果不对时记录查询编号、意见与修正内容，供后续分析和改进。&#x27;,&#x27;query_id与FeedbackRequest&#x27;,&#x27;反馈记录 / 导出数据&#x27;,&#x27;让坏结果成为可复现案例，而不是一句“AI又错了”。&#x27;,&#x27;生产API使用数据库FeedbackStore。项目有反馈处理器，但Engine中的定期后台调度仍有TODO，不能声称每条反馈立即自动训练或改写配置。&#x27;,&#x27;nl2dsl/feedback/store.py&#x27;,&#x27;FeedbackStore&#x27;);
n(&#x27;evaluation&#x27;,&#x27;测试 / 评测 / 质量分析&#x27;,&#x27;测试程序是否按规则运行；评测自然语言到DSL是否保留语义；质量分析检查实际链路证据。&#x27;,&#x27;测试用例、评测数据集、审计样本&#x27;,&#x27;分数、报告、回归结果&#x27;,&#x27;返回HTTP 200不等于业务正确，要检查指标、过滤、权限与规划。&#x27;,&#x27;tests覆盖单元/集成/E2E；evaluation含多维评分与canonical解析；quality分析实际记录。本次图基于静态代码核对，没有运行LLM或数据库查询。&#x27;,&#x27;nl2dsl/evaluation/v2_runner.py&#x27;,&#x27;评测入口；nl2dsl/quality/analyzer.py&#x27;);
n(&#x27;plugin&#x27;,&#x27;插件与组件协议&#x27;,&#x27;把LLM、存储或执行器等能力接到统一接口上，方便替换实现。&#x27;,&#x27;Plugin、Registry、Pipeline与Protocols&#x27;,&#x27;注册的组件或扩展管道&#x27;,&#x27;降低系统与单一厂商实现的绑定。&#x27;,&#x27;插件注册与默认Graph组装的实际时序要核对；“有插件类”不代表任何新节点都自动加入Graph。扩展执行路径仍应遵守DSL和治理。&#x27;,&#x27;nl2dsl/plugin.py&#x27;,&#x27;Plugin / Registry / Pipeline&#x27;);
n(&#x27;endpoints&#x27;,&#x27;接口路径：用途各不相同&#x27;,&#x27;/query完整查询；/query/dsl生成查询单；/query/execute接收查询单；/query/stream推送过程；/query/resume恢复审核。&#x27;,&#x27;不同HTTP请求模型&#x27;,&#x27;相应用途的响应&#x27;,&#x27;生成、执行、流式和恢复不是同一种调用。&#x27;,&#x27;当前前端queryAPI.queryStream用EventSource(GET)，而后端stream为POST；不能据函数存在就认定流式链路已经打通。QueryPage现在用普通query。&#x27;,&#x27;nl2dsl/api_factory.py&#x27;,&#x27;query_dsl / query_execute / query_stream / query_resume&#x27;);

const short={ui:&#x27;输入自然语言&#x27;,api:&#x27;API 接收请求&#x27;,agent:&#x27;Agent 编排&#x27;,graph:&#x27;Graph 查询流水线&#x27;,result:&#x27;解释并展示结果&#x27;,audit:&#x27;保存审计记录&#x27;,startup:&#x27;加载配置与领域&#x27;,entity:&#x27;抽取业务实体&#x27;,route:&#x27;判断查询意图&#x27;,plan:&#x27;拆解任务计划&#x27;,dispatch:&#x27;调度子查询&#x27;,aggregate:&#x27;汇总多个结果&#x27;,explore:&#x27;探索占位路径&#x27;,state:&#x27;共享查询状态&#x27;,clarify:&#x27;检测问题歧义&#x27;,gplan:&#x27;确认单查询计划&#x27;,decompose:&#x27;改写复杂表述&#x27;,generate:&#x27;生成 DSL&#x27;,validate:&#x27;校验 DSL&#x27;,correct:&#x27;检索并修正 DSL&#x27;,row:&#x27;注入行级权限&#x27;,col:&#x27;检查敏感维度&#x27;,semantic:&#x27;解析业务语义&#x27;,optimize:&#x27;语义优化（可选）&#x27;,confidence:&#x27;评估查询质量&#x27;,build:&#x27;构建 SQL&#x27;,scan:&#x27;扫描 SQL 安全&#x27;,sandbox:&#x27;沙箱预检&#x27;,review:&#x27;人工审核分支&#x27;,execute:&#x27;执行数据库查询&#x27;,post:&#x27;TopN / 占比后处理&#x27;,simplify:&#x27;简化 DSL 重试&#x27;,verify:&#x27;执行后模型自检&#x27;,explain:&#x27;生成自然语言解释&#x27;,rag:&#x27;检索业务上下文&#x27;,registry:&#x27;加载语义注册表&#x27;,permissions:&#x27;加载权限配置&#x27;,sync:&#x27;同步检索知识&#x27;,vector:&#x27;关键词 + 向量召回&#x27;,rerank:&#x27;重排与上下文拼装&#x27;,dsl:&#x27;结构化查询契约&#x27;,metric:&#x27;指标 · 算什么&#x27;,dimension:&#x27;维度 · 按什么分&#x27;,filter:&#x27;条件 · 查哪些行&#x27;,join:&#x27;关联 · 跨哪些表&#x27;,order:&#x27;排序 · 取多少行&#x27;,normalize:&#x27;结构规范化&#x27;,rules:&#x27;规则检测与修正&#x27;,canonical:&#x27;最终表达规范化&#x27;,feedback:&#x27;保存用户反馈&#x27;,evaluation:&#x27;评测与质量分析&#x27;,plugin:&#x27;插件组件注册&#x27;,endpoints:&#x27;查询接口集合&#x27;};

n(&#x27;supportHub&#x27;,&#x27;配套系统&#x27;,&#x27;为整个系统提供业务配置与权限规则，同时记录审计、收集反馈并评测质量。它不是查询流程最后才调用的一步。&#x27;,&#x27;YAML配置、查询状态、审计与用户反馈&#x27;,&#x27;领域工具、权限规则、日志与质量报告&#x27;,&#x27;让查询有统一口径、可治理、可追踪、可改进。&#x27;,&#x27;启动加载配置；Graph读取注册表与权限；API保存审计；反馈与评测用于改进。不同职责发生在不同时间，虚线表示支撑关系。&#x27;,&#x27;nl2dsl/engine.py&#x27;,&#x27;Engine._load_defaults；api_factory.py；evaluation&#x27;,null,&#x27;support&#x27;);

const teaching={&quot;idea&quot;: {&quot;walk&quot;: &quot;人话先变成DSL；程序校验业务白名单并加治理规则；程序构建SQL；数据库返回数据；解释和审计让结果可核对。不要把这几种职责混成一个“AI查库”步骤。&quot;, &quot;case&quot;: &quot;问题：华东各品牌销售额前5。逐一检查销售额口径、华东过滤、品牌分组、降序、limit=5。&quot;, &quot;qa&quot;: [{&quot;q&quot;: &quot;为什么不让模型直接写SQL？&quot;, &quot;a&quot;: &quot;DSL把业务请求限制在注册语义之内，便于结构校验、权限注入、规则修正和审计；SQL是程序从契约构建的执行产物。代价是DSL表达能力有限，新增分析能力要扩展模型与评测。&quot;}], &quot;practice&quot;: &quot;画出一条完整调用链，并找出每一层的输入输出；用同一问题核对配置、DSL、SQL三者含义。&quot;, &quot;file&quot;: &quot;nl2dsl/api.py&quot;, &quot;line&quot;: 3, &quot;symbol&quot;: &quot;app&quot;, &quot;code&quot;: &quot;   3  整个项目唯一的 app 创建方式是 :func:`nl2dsl.api_factory.create_app`。\n   4  本模块仅做两件事：\n   5  \n   6  1. 调用 ``create_app()`` 构建正式 app（复用 Engine 真实 DomainContext，\n   7     含 RAG / Optimizer / 权限 / 审计 / 数据库 FeedbackStore）。\n   8  2. 暴露模块级 ``app`` 供 ``uvicorn nl2dsl.api:app`` 与 ``from nl2dsl.api import app``\n   9     使用，确保生产入口与测试创建的 app 走同一实现，不再维护两套路由 / 请求模型 /\n  10     反馈逻辑。\n  11  \n  12  如需自定义注入（mock 数据库、自定义 registry 等），测试应直接调用\n  13  ``nl2dsl.api_factory.create_app(...)``，而不是修改本文件。\n  14  \&quot;\&quot;\&quot;\n  15  \n  16  from __future__ import annotations\n  17  \n  18  from nl2dsl.api_factory import create_app\n  19  \n  20  app = create_app()&quot;, &quot;test&quot;: null, &quot;answer&quot;: &quot;这个节点的职责是把它想成一位有公司制度约束的数据分析助理。你说业务语言，它先写一张结构化查询单，再经过审查，由程序去查数据库。 实现入口是nl2dsl/api.py里的app。它接收业务问题，例如“华东各品牌销售额前5名”，产出数据、查询单、SQL、解释和查询编号。关键边界是：关键区别：LLM负责理解，语义注册表决定业务含义，程序负责生成与执行SQL。结果是否真的回答问题，仍需核对过滤、分组与口径。&quot;}, &quot;ui&quot;: {&quot;walk&quot;: &quot;handleQuery先清理旧结果、标记loading；带question和tenantId调用queryAPI.query；成功或warning才展示数据；catch显示错误；finally结束loading。&quot;, &quot;case&quot;: &quot;如果后端返回clarification，这个页面会把它变成“查询存在歧义”提示，并非自动展开多轮追问。&quot;, &quot;qa&quot;: [{&quot;q&quot;: &quot;页面进度条是真实执行进度吗？&quot;, &quot;a&quot;: &quot;目前progressEvents是请求前后手动写的数组，不能当作后端每个节点的实时证据。真正过程应查trace，流式接口需另外打通。&quot;}], &quot;practice&quot;: &quot;打开QueryPage.tsx和api/query.ts，对照普通POST和EventSource实现，列出两种请求的差别。&quot;, &quot;file&quot;: &quot;web/src/pages/QueryPage.tsx&quot;, &quot;line&quot;: 22, &quot;symbol&quot;: &quot;handleQuery&quot;, &quot;code&quot;: &quot;  22    const handleQuery = async (question: string) =&gt; {\n  23      setLoading(true);\n  24      setError(null);\n  25      setResult(null);\n  26      setProgressEvents([\n  27        { node: &#x27;clarification&#x27;, status: &#x27;pending&#x27; },\n  28        { node: &#x27;dsl&#x27;, status: &#x27;pending&#x27; },\n  29      ]);\n  30  \n  31      try {\n  32        const { data } = await queryAPI.query({\n  33          question,\n  34          user_id: &#x27;web_user&#x27;,\n  35          tenant_id: tenantId,\n  36        });\n  37        const usableStatus = data.status === &#x27;success&#x27; || data.status === &#x27;warning&#x27;;\n  38        if (!usableStatus || !data.data) {\n  39          throw new Error(data.status === &#x27;clarification&#x27; ? &#x27;查询存在歧义&#x27; : &#x27;查询执行失败，请重试&#x27;);\n  40        }\n  41        setResult(data);\n  42        if (data.status === &#x27;warning&#x27;) {&quot;, &quot;test&quot;: null, &quot;answer&quot;: &quot;这个节点的职责是这是你看见的页面：输入问题，发送请求，再把结果画成表格、柱状图或折线图。 实现入口是web/src/pages/QueryPage.tsx里的handleQuery。它接收question、user_id=web_user、tenant_id，产出HTTP请求与可视化结果。关键边界是：当前QueryPage调用普通POST查询；进度数组由前端手工更新，并非每个后端节点实时推送。澄清状态目前被显示为错误提示，完整多轮澄清交互并未在此页面实现。&quot;}, &quot;api&quot;: {&quot;walk&quot;: &quot;api.py创建app；query验证domain、生成query_id；启用时做澄清预检；抽取实体并调用controller；复杂/探索进入orchestrator，简单进入领域Graph；最后记录审计并组织响应。&quot;, &quot;case&quot;: &quot;相同问题选择不同domain会使用不同注册表和领域运行时。未知domain在/query被拒绝。&quot;, &quot;qa&quot;: [{&quot;q&quot;: &quot;API里放多少业务逻辑合适？&quot;, &quot;a&quot;: &quot;API负责请求校验、身份上下文、路由调用与响应；指标理解、权限、构建SQL应在专门组件中。本实现仍有接入层预检和分流，应描述实际代码而非说API完全没有业务判断。&quot;}], &quot;practice&quot;: &quot;从query函数找到进入Graph和Orchestrator的两条分支，跟踪query_id如何写入审计。&quot;, &quot;file&quot;: &quot;nl2dsl/api_factory.py&quot;, &quot;line&quot;: 871, &quot;symbol&quot;: &quot;query&quot;, &quot;code&quot;: &quot; 871      async def query(req: QueryRequest) -&gt; QueryResponse:\n 872          start = time.time()\n 873          query_id = str(uuid.uuid4())\n 874          # 领域校验：未知 domain 立即失败，不静默回退 ecommerce。\n 875          _get_domain_graph(req.domain)\n 876  \n 877          try:\n 878              # Step 0: Clarification check (only when enabled)\n 879              if enable_clarification:\n 880                  t = time.time()\n 881                  ambiguities = clarification_detector.detect(req.question)\n 882                  if ambiguities:\n 883                      trace = [{\&quot;step\&quot;: \&quot;clarification\&quot;, \&quot;status\&quot;: \&quot;success\&quot;, \&quot;duration_ms\&quot;: int((time.time() - t) * 1000)}]\n 884                      audit_logger.log(\n 885                          query_id=query_id,\n 886                          user_id=req.user_id,\n 887                          tenant_id=req.tenant_id,\n 888                          question=req.question,\n 889                          status=\&quot;clarification\&quot;,\n 890                          execution_time_ms=int((time.time() - start) * 1000),\n 891                          trace_json=trace,\n 892                      )\n 893                      return QueryResponse(&quot;, &quot;test&quot;: null, &quot;answer&quot;: &quot;这个节点的职责是API像前台，收下问题与身份信息，选择电商、银行或供应链等领域，然后把任务交给引擎。 实现入口是nl2dsl/api_factory.py里的query。它接收问题、用户、租户、domain，产出Graph或Agent执行结果，统一响应。关键边界是：生产入口api.py只调用api_factory.create_app。/query先验证domain，未知领域直接失败。领域选择与用户权限是两个不同概念；请求携带身份字段本身不等于完成身份认证。&quot;}, &quot;agent&quot;: {&quot;walk&quot;: &quot;run先抽实体，controller.route返回执行计划；简单调用_run_simple_path；复杂调用_run_complex_path；复杂路径dispatch后aggregate并解释。&quot;, &quot;case&quot;: &quot;对比华东、华南销售额需要两个子任务，各自得到数据后再比较，不能把两个过滤条件都用AND塞到同一总数里。&quot;, &quot;qa&quot;: [{&quot;q&quot;: &quot;Agent和Graph的区别？&quot;, &quot;a&quot;: &quot;Agent负责任务级编排，Graph负责一个查询的确定性处理；拆分后的SubQuery复用Graph，治理逻辑不应为每种意图重复实现。&quot;}], &quot;practice&quot;: &quot;用test_agent_orchestrator或dispatcher测试读懂简单、全部失败、部分失败三类行为。&quot;, &quot;file&quot;: &quot;nl2dsl/agent/orchestrator.py&quot;, &quot;line&quot;: 237, &quot;symbol&quot;: &quot;run&quot;, &quot;code&quot;: &quot; 237      async def run(\n 238          self,\n 239          question: str,\n 240          user_id: str,\n 241          tenant_id: str,\n 242          domain: str,\n 264          domain_context = self._get_domain_context(domain)\n 265  \n 266          # Agent 编排 Trace：记录真实步骤，供审计与质量分析器判定完整性。\n 267          trace: list[dict] = [{\&quot;step\&quot;: \&quot;agent\&quot;, \&quot;status\&quot;: \&quot;start\&quot;}]\n 268  \n 269          # ------------------------------------------------------------------\n 270          # Step 1: Extract entities\n 271          # ------------------------------------------------------------------\n 272          try:\n 273              entities = self._extract_entities(question)\n 274          except Exception as exc:\n 275              logger.error(\&quot;[orchestrator] Entity extraction failed: %s\&quot;, exc, exc_info=True)\n 276              await self._emit_event(sse_callback, \&quot;error\&quot;, {\&quot;error\&quot;: str(exc), \&quot;step\&quot;: \&quot;entity_extraction\&quot;})\n 277              trace.append({\&quot;step\&quot;: \&quot;entity_extraction\&quot;, \&quot;status\&quot;: \&quot;error\&quot;, \&quot;error\&quot;: str(exc)})\n 278              return AgentResult(status=\&quot;error\&quot;, error=f\&quot;Entity extraction failed: {exc}\&quot;, trace=trace)\n 279  \n 280          # ------------------------------------------------------------------\n 281          # Step 2: Route via AgentController\n 282          # ------------------------------------------------------------------\n 283          try:&quot;, &quot;test&quot;: null, &quot;answer&quot;: &quot;这个节点的职责是像项目经理：辨认你是要一次查询，还是对比、趋势等需要多个子任务的问题。 实现入口是nl2dsl/agent/orchestrator.py里的run。它接收自然语言和抽取出的业务实体，产出执行计划Plan、一个或多个SubQuery。关键边界是：普通/query的简单计划直接走Graph；复杂或探索计划交给AgentOrchestrator。编排器内部会再次抽取实体与路由。流式端点有自己的编排分支。&quot;}, &quot;graph&quot;: {&quot;walk&quot;: &quot;build_graph把函数注册为节点，把校验和权限子图嵌入主图，配置条件路由后compile；调用ainvoke会按状态沿边推进。&quot;, &quot;case&quot;: &quot;校验失败→修正→再校验是局部循环；执行失败→简化→build_sql是另一条循环，计数不能混用。&quot;, &quot;qa&quot;: [{&quot;q&quot;: &quot;为什么用StateGraph而不是一个大函数？&quot;, &quot;a&quot;: &quot;条件分支、状态更新、局部重试和检查点可以显式表达。代价是状态合并、错误传播、子图结束与父图结束等细节更复杂，要用测试核对。&quot;}], &quot;practice&quot;: &quot;对照builder与edges，把每条条件边的返回标签填到流程图上。&quot;, &quot;file&quot;: &quot;nl2dsl/graph/builder.py&quot;, &quot;line&quot;: 38, &quot;symbol&quot;: &quot;build_graph&quot;, &quot;code&quot;: &quot;  38  def build_graph(\n  39      *,\n  40      llm_client,\n  41      rag_retriever,\n  42      validator: DSLValidator,\n  43      row_security: RowLevelSecurity,\n 113      # -----------------------------------------------------------------------\n 114      # Create node functions with injected dependencies\n 115      # -----------------------------------------------------------------------\n 116      nodes = create_node_functions(\n 117          llm_client=llm_client,\n 118          rag_retriever=rag_retriever,\n 119          validator=validator,\n 120          row_security=row_security,\n 121          col_security=col_security,\n 122          resolver=resolver,\n 123          sql_builder=sql_builder,\n 124          scanner=scanner,\n 125          sandbox=sandbox,\n 126          executor=executor,\n 127          clarification_detector=clarification_detector,\n 128          registry_dict=registry_dict,\n 129          llm_system_prompt=llm_system_prompt,\n 130          optimizer_semantic_config=optimizer_semantic_config,\n 131      )\n 132  &quot;, &quot;test&quot;: &quot;tests/unit/test_graph_builder.py&quot;, &quot;answer&quot;: &quot;这个节点的职责是像一条固定工序的流水线：把每个查询单逐步校验、加权限、转SQL、扫描，再执行。 实现入口是nl2dsl/graph/builder.py里的build_graph。它接收QueryState：问题、身份、DSL、状态，产出结果数据与更新后的QueryState。关键边界是：实际主图由graph/builder.py组装。它含校验子图、权限子图及条件分支；并非所有节点每次都会调用LLM，也并非 quot;: &quot;销售额按品牌分组可能需要产品维度表；最终SQL的字段与expr必须来自配置。&quot;, &quot;qa&quot;: [{&quot;q&quot;: &quot;为什么SQLAlchemy Core？&quot;, &quot;a&quot;: &quot;表达式树适合动态组合查询，便于列对象、聚合和条件处理；但代码仍有text(expr)等路径，安全边界必须结合注册配置与扫描审查。&quot;}], &quot;practice&quot;: &quot;用test_sql_builder.py查看构建SQL断言，并检查COUNT DISTINCT与不同Join类型是否正确实现。&quot;, &quot;file&quot;: &quot;nl2dsl/graph/builder.py&quot;, &quot;line&quot;: 1, &quot;symbol&quot;: &quot;build_sql → scan_sql → sandbox_check → execute_sql&quot;, &quot;code&quot;: &quot;   1  \&quot;\&quot;\&quot;StateGraph builder for the NL2DSL query pipeline.\n   2  \n   3  Assembles nodes, edges, subgraphs, and optional checkpointer into a compiled\n   4  LangGraph StateGraph.\n   5  \&quot;\&quot;\&quot;\n   6  \n   7  from __future__ import annotations\n   8  \n   9  from typing import TYPE_CHECKING\n  10  \n  11  from langgraph.graph import StateGraph, END\n  12  \n  13  from nl2dsl.graph.state import QueryState\n  14  from nl2dsl.graph.nodes import create_node_functions\n  15  from nl2dsl.graph.edges import (\n  16      route_after_clarification,\n  17      route_after_plan,\n  18      route_after_confidence,\n  19      route_after_sandbox,\n  20      route_after_execute,\n  21      detect_complexity,&quot;, &quot;test&quot;: null, &quot;answer&quot;: &quot;这个节点的职责是由程序把DSL转换为SQL，经过安全扫描与沙箱预检，再读取数据库。 实现入口是nl2dsl/graph/builder.py里的build_sql → scan_sql → sandbox_check → execute_sql。它接收DSL与数据库连接，产出数据行、执行状态与trace。关键边界是：这是多个Graph节点的概括；风险审核、失败重试和结果后处理请进入Graph完整路径查看。&quot;}, &quot;graph-sub&quot;: {&quot;walk&quot;: &quot;build_graph把函数注册为节点，把校验和权限子图嵌入主图，配置条件路由后compile；调用ainvoke会按状态沿边推进。&quot;, &quot;case&quot;: &quot;校验失败→修正→再校验是局部循环；执行失败→简化→build_sql是另一条循环，计数不能混用。&quot;, &quot;qa&quot;: [{&quot;q&quot;: &quot;为什么用StateGraph而不是一个大函数？&quot;, &quot;a&quot;: &quot;条件分支、状态更新、局部重试和检查点可以显式表达。代价是状态合并、错误传播、子图结束与父图结束等细节更复杂，要用测试核对。&quot;}], &quot;practice&quot;: &quot;对照builder与edges，把每条条件边的返回标签填到流程图上。&quot;, &quot;file&quot;: &quot;nl2dsl/graph/builder.py&quot;, &quot;line&quot;: 38, &quot;symbol&quot;: &quot;build_graph&quot;, &quot;code&quot;: &quot;  38  def build_graph(\n  39      *,\n  40      llm_client,\n  41      rag_retriever,\n  42      validator: DSLValidator,\n  43      row_security: RowLevelSecurity,\n 113      # -----------------------------------------------------------------------\n 114      # Create node functions with injected dependencies\n 115      # -----------------------------------------------------------------------\n 116      nodes = create_node_functions(\n 117          llm_client=llm_client,\n 118          rag_retriever=rag_retriever,\n 119          validator=validator,\n 120          row_security=row_security,\n 121          col_security=col_security,\n 122          resolver=resolver,\n 123          sql_builder=sql_builder,\n 124          scanner=scanner,\n 125          sandbox=sandbox,\n 126          executor=executor,\n 127          clarification_detector=clarification_detector,\n 128          registry_dict=registry_dict,\n 129          llm_system_prompt=llm_system_prompt,\n 130          optimizer_semantic_config=optimizer_semantic_config,\n 131      )\n 132  &quot;, &quot;test&quot;: &quot;tests/unit/test_graph_builder.py&quot;, &quot;answer&quot;: &quot;这个节点的职责是像一条固定工序的流水线：把每个查询单逐步校验、加权限、转SQL、扫描，再执行。 实现入口是nl2dsl/graph/builder.py里的build_graph。它接收QueryState：问题、身份、DSL、状态，产出结果数据与更新后的QueryState。关键边界是：实际主图由graph/builder.py组装。它含校验子图、权限子图及条件分支；并非所有节点每次都会调用LLM，也并非每条边都立即终止错误状态。&quot;}};

ummary&gt;⑥ 练习怎样清楚地回答&lt;/summary&gt;&lt;p&gt;${esc(t.answer||&#x27;&#x27;)}&lt;/p&gt;&lt;p&gt;回答顺序：业务问题 → 实现位置 → 实际行为 → 权衡与限制 → 你亲自验证过的证据。不要把这段讲解直接说成自己的开发经历。&lt;/p&gt;&lt;/details&gt;&lt;section class=&quot;lesson-section&quot;&gt;&lt;h3&gt;⑦ 动手验证，积累真实经验&lt;/h3&gt;&lt;p&gt;${esc(t.practice||&#x27;&#x27;)}&lt;/p&gt;${t.test?&#x27;&lt;p&gt;可阅读的现有测试：&lt;code&gt;&#x27;+esc(t.test)+&#x27;&lt;/code&gt;&lt;/p&gt;&lt;pre&gt;&lt;code&gt;python -m pytest &#x27;+esc(t.test)+&#x27; -q&lt;/code&gt;&lt;/pre&gt;&lt;p class=&quot;text-small&quot;&gt;这是供你运行的命令，本次讲解没有声称这些测试已执行或已通过。&lt;/p&gt;&#x27;:&#x27;&#x27;}&lt;p&gt;记录：输入与配置、复现步骤、预期与实际差异、根因所在函数、改动或验证方式。完成后才能用“我复现过／我验证过／我修复过”对应真实经历。&lt;/p&gt;&lt;/section&gt;${d.child&amp;&amp;views[d.child]?&#x27;&lt;div class=&quot;viz-row&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-view=&quot;&#x27;+d.child+&#x27;&quot;&gt;进入内部流程 →&lt;/button&gt;&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;`;}
