&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;nl-architecture&#x27;),components={};
function c(id,title,file,role,io,links,boundary,status=&#x27;已实现&#x27;){components[id]={id,title,file,role,io,links,boundary,status};}
c(&#x27;queryui&#x27;,&#x27;查询工作台&#x27;,&#x27;web/src/pages/QueryPage.tsx&#x27;,&#x27;收集自然语言问题，发送普通POST请求，处理loading、success、warning和error。&#x27;,&#x27;输入问题、租户 → QueryResponse&#x27;,&#x27;调用 web/src/api/query.ts → POST /api/v1/query&#x27;,&#x27;当前页面进度数组是请求前后手动更新，不能当作真实节点流；澄清交互仍较简单。&#x27;);
c(&#x27;resultui&#x27;,&#x27;表格 / 图表 / DSL / SQL&#x27;,&#x27;web/src/components/query/ResultTabs.tsx&#x27;,&#x27;把数据和执行依据展示给用户，帮助核对过滤、聚合、口径与结果。&#x27;,&#x27;data、dsl、sql、trace → 可读结果&#x27;,&#x27;ResultTable、ResultChart、DSLViewer、TracePanel等组件&#x27;,&#x27;界面展示不自动证明语义正确，warning和缺失子结果应结合实际响应理解。&#x27;);
c(&#x27;adminui&#x27;,&#x27;管理与审计界面&#x27;,&#x27;web/src/pages/AdminPage.tsx&#x27;,&#x27;提供指标、权限与审计记录等管理视图。&#x27;,&#x27;管理接口响应 → 组件展示&#x27;,&#x27;MetricTable、PermissionTable、AuditLogTable&#x27;,&#x27;展示管理功能不等于已经具备完整的身份认证、权限审批与配置发布平台。&#x27;);
c(&#x27;api&#x27;,&#x27;FastAPI 请求接入&#x27;,&#x27;nl2dsl/api_factory.py&#x27;,&#x27;create_app统一创建应用；/query验证领域、分流执行并包装结果；api.py只暴露app。&#x27;,&#x27;HTTP请求 → 领域Graph / Agent → HTTP响应&#x27;,&#x27;nl2dsl/api.py → create_app → Engine / DomainContext&#x27;,&#x27;API接收user_id和tenant_id不等于已建立可信身份认证。未知领域在/query明确失败。&#x27;);
c(&#x27;endpoints&#x27;,&#x27;查询 / DSL / 执行 / 恢复&#x27;,&#x27;nl2dsl/api_factory.py&#x27;,&#x27;提供/query、/query/dsl、/query/execute、/query/stream、/query/resume等不同用途入口。&#x27;,&#x27;自然语言或提交的DSL → 对应结果 / 事件 / 恢复&#x27;,&#x27;stream为POST；resume关联Graph检查点&#x27;,&#x27;前端queryStream使用GET EventSource，而后端stream为POST；接口存在不等于前端流式协议已对齐。&#x27;);
c(&#x27;contracts&#x27;,&#x27;请求响应与异常契约&#x27;,&#x27;nl2dsl/exceptions.py&#x27;,&#x27;请求模型规定输入，统一响应传递状态、数据、DSL、SQL与说明；异常类型区分校验、语义和权限问题。&#x27;,&#x27;请求模型 / NL2DSLException → 统一响应&#x27;,&#x27;请求响应模型主要在api_factory.py，前端映射在web/src/types/api.ts&#x27;,&#x27;业务失败、空结果、warning、clarification是不同语义；HTTP成功不代表指标与条件正确。&#x27;);
c(&#x27;controller&#x27;,&#x27;实体抽取与意图路由&#x27;,&#x27;nl2dsl/agent/controller.py&#x27;,&#x27;先用Planner判断意图，再区分SimpleExecutionPlan、ComplexExecutionPlan与ExplorationPlan。&#x27;,&#x27;问题 + Entities → ExecutionPlan&#x27;,&#x27;AgentOrchestrator._extract_entities → AgentController.route → Planner&#x27;,&#x27;降级时按实体数量或时间提示判断，可能粗糙；single_query无维度也可能包装成探索计划。&#x27;);
c(&#x27;planner&#x27;,&#x27;规划 / 子任务 / 依赖&#x27;,&#x27;nl2dsl/agent/planner.py&#x27;,&#x27;产生Plan和SubQuery，说明查哪些数据、子查询间是否依赖及汇总意图。&#x27;,&#x27;问题 → intent、sub_queries、reasoning&#x27;,&#x27;意图配置 configs/intents.yaml；复杂规划由AgentOrchestrator消费&#x27;,&#x27;这是任务规划器，与nl2dsl/planner下的传统SQL规划辅助模块不同。探索路径目前委托简单路径。&#x27;);
c(&#x27;orchestrator&#x27;,&#x27;调度 / 汇总 / 解释&#x27;,&#x27;nl2dsl/agent/orchestrator.py&#x27;,&#x27;简单任务调用Graph；复杂任务通过dispatcher调度子查询、Aggregate汇总，再生成说明。&#x27;,&#x27;Plan → 多个QueryResult → AgentResult&#x27;,&#x27;dispatcher.py、aggregator.py、explainer.py → DomainContext.graph&#x27;,&#x27;无依赖子任务上限3个并发；同步LLM/数据库调用可能限制实际并发。部分失败通常warning，全部阻断返回error。&#x27;);
c(&#x27;graph&#x27;,&#x27;LangGraph 状态图&#x27;,&#x27;nl2dsl/graph/builder.py&#x27;,&#x27;把节点、子图和条件边编译为统一单查询流水线，所有子查询复用它。&#x27;,&#x27;QueryState → 更新的QueryState&#x27;,&#x27;clarification → plan → decompose → validation → permission → semantic → optimizer → confidence → SQL&#x27;,&#x27;Graph是编排层；下方语义治理与SQL层是它调用的组件，不是与Graph互相替代的两套执行系统。&#x27;);
c(&#x27;state&#x27;,&#x27;状态 / Trace / 尝试记录&#x27;,&#x27;nl2dsl/graph/state.py&#x27;,&#x27;QueryState携带问题、身份、DSL、SQL、数据、错误与trace；reducer累积trace和dsl_attempts。&#x27;,&#x27;节点返回dict → 合并状态&#x27;,&#x27;Annotated reducer；父图/子图共享状态契约&#x27;,&#x27;TypedDict主要描述类型，并非所有状态都运行时强校验。trace按字典相等去重可能合并完全相同事件。&#x27;);
c(&#x27;recovery&#x27;,&#x27;澄清 / 审核 / 重试&#x27;,&#x27;nl2dsl/graph/edges.py&#x27;,&#x27;显式选择澄清、校验修正、人工审核及执行失败简化重试等分支。&#x27;,&#x27;状态与风险 → 下一个节点或END&#x27;,&#x27;subgraphs.py校验循环；checkpointer控制human_review前中断&#x27;,&#x27;校验计数上限3，执行简化最多1次；简化会删除filters且直接回build_sql，可能丢权限。审核依赖检查点，不是完整审批产品。&#x27;);
c(&#x27;dsl&#x27;,&#x27;DSL / Pydantic 契约&#x27;,&#x27;nl2dsl/dsl/models.py&#x27;,&#x27;以结构化对象描述指标、维度、条件树、关联、时间、排序与后处理。&#x27;,&#x27;JSON → DSL对象&#x27;,&#x27;Aggregation、FilterTreeNode、OrderBy、Join、PostProcess → 所有处理组件&#x27;,&#x27;LLM生成DSL而非SQL。Schema只能约束形状，不能单独保证业务口径和权限正确。&#x27;);
c(&#x27;validation&#x27;,&#x27;结构与业务校验&#x27;,&#x27;nl2dsl/dsl/validator.py&#x27;,&#x27;校验注册源、指标alias、维度、源覆盖与后处理要求；生成入口可调用SemanticValidator。&#x27;,&#x27;DSL + registry → 通过或ValidationError&#x27;,&#x27;DSL.model_validate；semantic_validator.py；correct_dsl循环&#x27;,&#x27;不要把所有字段和过滤都认为已完整授权；应逐条看当前校验器覆盖范围。&#x27;);
c(&#x27;semantic&#x27;,&#x27;注册表与语义解析&#x27;,&#x27;nl2dsl/semantic/resolver.py&#x27;,&#x27;注册表决定计算口径，Resolver按alias展开指标；SQLBuilder负责物理列和业务编码映射。&#x27;,&#x27;注册DSL → 可供SQL构建的业务表达&#x27;,&#x27;semantic/registry.py ← configs/metrics.yaml；SQLBuilder._translate_filter_value&#x27;,&#x27;当前电商销售额=SUM(order_amount)。Resolver保留业务值，不应描述为所有枚举都在这里转物理编码。&#x27;);
c(&#x27;permission&#x27;,&#x27;行级 / 列级 / 租户&#x27;,&#x27;nl2dsl/permission/row_level.py&#x27;,&#x27;从用户权限配置追加行级条件和配置tenant_id；ColumnLevelSecurity检查敏感维度。&#x27;,&#x27;DSL + user_id + 配置 → 权限DSL / 拒绝&#x27;,&#x27;permission/column_level.py ← configs/permissions.yaml&#x27;,&#x27;未知用户当前返回原DSL；列检查只遍历dimensions。mask方法存在，但当前执行节点未调用，不能声称结果已全面脱敏。&#x27;);
c(&#x27;optimizer&#x27;,&#x27;语义规则优化器&#x27;,&#x27;nl2dsl/optimizer/__init__.py&#x27;,&#x27;Normalizer规范结构，RuleEngine按优先级检查并修正，输出OptimizationReport。&#x27;,&#x27;DSL + SemanticConfig → optimized DSL + 报告&#x27;,&#x27;9类规则：指标、维度、过滤、意图、规划、时间、歧义、治理、结构&#x27;,&#x27;主图位置是权限→语义解析→优化→置信度；需配置才挂载，生产Engine传入配置。只有Fatal Reject明确终止。&#x27;);
c(&#x27;confidence&#x27;,&#x27;置信度与结果自检&#x27;,&#x27;nl2dsl/agent/confidence.py&#x27;,&#x27;执行前评估语法和语义匹配；执行后的verify_dsl再次判断是否回答原问题。&#x27;,&#x27;DSL + 原问题 + 可选LLM → 分数 / warning / 说明&#x27;,&#x27;graph/nodes.py::_make_verify_dsl_node；explain节点&#x27;,&#x27;分数实际0～1，history固定1；中性降级不阻断，已有Plan可把澄清降为warning。结果自检是warning-only。&#x27;);
c(&#x27;sqlbuild&#x27;,&#x27;SQLAlchemy 构建 / Join&#x27;,&#x27;nl2dsl/sql_engine/builder.py&#x27;,&#x27;从DSL和注册表达式构建SELECT、聚合、过滤、分组、排序与分页，按列依赖推导Join。&#x27;,&#x27;DSL + 表元数据 → SQL&#x27;,&#x27;SQLBuilder.build；_determine_required_joins；value_maps&#x27;,&#x27;SQL由程序构建，不能让LLM自由生成。复杂expr中存在text路径，Join类型与基数仍需核对。&#x27;);
c(&#x27;safety&#x27;,&#x27;SQL 扫描与沙箱&#x27;,&#x27;nl2dsl/sql_engine/scanner.py&#x27;,&#x27;正则扫描禁用SQL模式；沙箱运行EXPLAIN和受限预览，标记成本与风险。&#x27;,&#x27;SQL → 扫描通过 / SandboxResult&#x27;,&#x27;query/sandbox.py → 风险路由human_review&#x27;,&#x27;沙箱估算偏SQLite且粗糙；已有LIMIT不一定缩成10；耗时检查不是强制取消。扫描异常也需检查后续边，不能声称绝对安全。&#x27;);
c(&#x27;execution&#x27;,&#x27;数据库执行与后处理&#x27;,&#x27;nl2dsl/sql_engine/executor.py&#x27;,&#x27;连接数据库执行SQL，将Row转成dict；节点内按DSL进行分组TopN或占比后处理。&#x27;,&#x27;SQL → list[dict] → 后处理data&#x27;,&#x27;graph/nodes.py::execute_sql_node → query/post_processor.py&#x27;,&#x27;Executor是同步实现；没有这里的独立硬超时/脱敏。占比分母来自返回行，LIMIT截断会改变口径。&#x27;);
c(&#x27;businessdb&#x27;,&#x27;业务数据库 · 默认 SQLite&#x27;,&#x27;nl2dsl/engine.py&#x27;,&#x27;按领域创建默认SQLite数据库文件，存放事实表和维度表等业务数据。&#x27;,&#x27;SQL → 原始业务行 / 聚合结果&#x27;,&#x27;data/nl2dsl.db；其他领域按domain命名&#x27;,&#x27;SQLAlchemy抽象不等于所有数据库方言已经端到端验证。连接策略以当前_get_db_url实现为准。&#x27;);
c(&#x27;vectorstore&#x27;,&#x27;知识检索库 · Milvus&#x27;,&#x27;nl2dsl/rag/store.py&#x27;,&#x27;保存业务schema、metrics、terms、history的检索文档和向量。&#x27;,&#x27;业务知识与向量 → 检索候选&#x27;,&#x27;每域Milvus Lite；RAGRetriever消费&#x27;,&#x27;这是知识参考库，不是保存销售订单的业务库。RAG初始化可失败并降级，不是所有环境都有可用向量检索。&#x27;);
c(&#x27;persistent&#x27;,&#x27;审计 / 反馈 / 检查点&#x27;,&#x27;nl2dsl/audit/logger.py&#x27;,&#x27;审计与反馈持久化查询证据；检查点保存人工审核恢复所需的Graph状态。&#x27;,&#x27;trace、意见、状态 → 存储与恢复&#x27;,&#x27;feedback/store.py使用数据库；Engine使用InMemorySaver&#x27;,&#x27;检查点当前是内存实现，不应画成已部署的Redis或持久化恢复集群。审计保留策略需按代码落实情况判断。&#x27;);
c(&#x27;llm&#x27;,&#x27;LLM Provider 与客户端&#x27;,&#x27;nl2dsl/llm/providers.py&#x27;,&#x27;管理OpenAI兼容模型Provider与当前选择，供规划、DSL生成、评估、自检与解释使用。&#x27;,&#x27;Prompt / JSON Schema → 模型输出&#x27;,&#x27;llm/client.py、prompts.py → Agent与Graph&#x27;,&#x27;无配置返回None并用规则生成；运行时切换注册中心不等于已编译Graph捕获的旧客户端自动被替换。&#x27;,&#x27;可选依赖&#x27;);
c(&#x27;rag&#x27;,&#x27;RAG / Embedder / Reranker&#x27;,&#x27;nl2dsl/rag/retriever.py&#x27;,&#x27;关键词+整句语义召回，选配重排后构造上下文，辅助DSL生成和纠正。&#x27;,&#x27;问题 → context → generate_dsl / correct_dsl&#x27;,&#x27;embedder.py、reranker.py、sync.py、store.py；作用于L3/L4相关调用&#x27;,&#x27;RAG在生成与修正函数内部，不是主Graph独立节点。嵌入模型和检索库不可用可降级。&#x27;,&#x27;可选依赖&#x27;);
c(&#x27;config&#x27;,&#x27;YAML 业务与策略配置&#x27;,&#x27;configs/metrics.yaml&#x27;,&#x27;指标expr、维度column/value_map、源关联决定业务口径；权限、术语、意图、历史分别提供规则。&#x27;,&#x27;配置 → 注册表 / Prompt / 权限 / 检索库&#x27;,&#x27;permissions.yaml、terms.yaml、intents.yaml、history.yaml及bank_*&#x27;,&#x27;当前configs可见电商和银行指标配置，没有把供应链当作当前已发现领域；不同配置需核对刷新机制。&#x27;);
c(&#x27;engine&#x27;,&#x27;Engine / DomainContext&#x27;,&#x27;nl2dsl/engine.py&#x27;,&#x27;发现领域并组装独立注册表、校验器、权限、SQLBuilder、数据库、RAG与编译Graph。&#x27;,&#x27;配置 + 共享组件 → domains[domain]&#x27;,&#x27;domain_context.py；LLM/嵌入模型可跨域共享，其余主要按域封装&#x27;,&#x27;领域隔离与租户隔离是不同概念。默认用户策略、未知domain行为、权限配置回退都要分别核对。&#x27;);

        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
